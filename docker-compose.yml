# Run from the repository root:
# docker compose up -d --build
services:
  cpa-usage-keeper:
    container_name: cpa-usage-keeper
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./keeper:/data
    security_opt:
      - seccomp=unconfined
